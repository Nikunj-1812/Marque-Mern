<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card1.css">
</head>
<body>

<div class="container">

    <div class="card">
        <div class="circle"></div>

        <img src="https://fenil10-portfolio.vercel.app/fenil.png"
            class="profile">

        <h2>Fenil Nikunj sorathiya</h2>
        <p>Web Developer in India</p>

        <div class="stats">

            <div>
                <h3>100</h3>
                <span>rejected</span>
            </div>

            <div>
                <h3>42sub</h3>
                <span>1dayLeetcode</span>
            </div>

            <div>
                <h3>300</h3>
                <span>per day</span>
            </div>

        </div>

        <div class="buttons">

            <button class="message">Message</button>
        </div>

    </div>

</div>

</body>
</html>
