<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Code for Propagation */
      #grand-parent {
        width: 300px;
        height: 300px;
        background-color: red;
      }
      #parent {
        width: 200px;
        height: 200px;
        background-color: rgb(200, 119, 119);
      }
      #child {
        width: 100px;
        height: 100px;
        background-color: rgb(162, 223, 7);
      }
      #grand-child {
        width: 50px;
        height: 50px;
        background-color: rgb(10, 187, 206);
      }
      #grand-parent,
      #parent,
      #child,
      #grand-child {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h3>Another Example</h3>
    <div id="grand-parent">
      <div id="parent">
        <div id="child">
          <div id="grand-child"></div>
        </div>
      </div>
    </div>

    <!-- Link Example -->

    <h3>Here is the Link</h3>
    <a href="https://docs.langchain.com/oss/python/langchain/agents">Click Here </a>

    <script>
        const box1 = document.getElementById("grand-parent")
        const box2 = document.getElementById("parent")
        const box3 = document.getElementById("child")
        const box4 = document.getElementById("grand-child")

        box1.addEventListener("mouseover" , function(){
            console.log(getComputedStyle(box1).backgroundColor);
        })
        box2.addEventListener("mouseover" , function(){
            console.log(getComputedStyle(box2).backgroundColor);
        })
        box3.addEventListener("mouseover" , function(){
            console.log(getComputedStyle(box3).backgroundColor);
        })
        box4.addEventListener("mouseover" , function(){
            console.log(getComputedStyle(box1).backgroundColor);
        })
        
    </script>
   
  </body>
</html>
